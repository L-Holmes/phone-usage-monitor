<!--
  CONCEPT 1 — "THE TURN"  ← the chosen default mark.

  A trend line that falls, bottoms out at a marked node, and climbs away steeply.
  The dim half is the habit; the bright half is after. The node is the decision.

  Why this one: it is the only concept that says "a trajectory was REVERSED" rather
  than the generic "charts go up". Still legible at 24px, where it reduces to a
  bold V with a dot on it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="The Turn">
  <defs>
    <linearGradient id="turn-tile" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#18B7A2"/>
      <stop offset="1" stop-color="#0C8073"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#turn-tile)"/>

  <!-- the habit: falling, and losing its conviction as it goes -->
  <path d="M92 132 C 132 264, 166 344, 244 358"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.42"
        stroke-width="36" stroke-linecap="round"/>

  <!-- after: shorter, steeper, decisive -->
  <path d="M244 358 C 320 358, 356 250, 414 122"
        fill="none" stroke="#FFFFFF"
        stroke-width="36" stroke-linecap="round"/>

  <!-- the decision -->
  <circle cx="244" cy="358" r="34" fill="url(#turn-tile)"/>
  <circle cx="244" cy="358" r="34" fill="#0C8073" fill-opacity="0.25"/>
  <circle cx="244" cy="358" r="17" fill="#FFFFFF"/>
</svg>
