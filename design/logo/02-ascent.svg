<!--
  CONCEPT 2 — "ASCENT"

  Four rising bars on a baseline, with a detached chevron above the tallest: the
  trend is up and has not finished. The most conventionally "serious analytics"
  of the set, and the most legible at tiny sizes.

  Against it: every dashboard product on earth owns a version of this. Safe, not
  distinctive, and it says nothing about breaking a habit.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Ascent">
  <defs>
    <linearGradient id="asc-tile" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#18B7A2"/>
      <stop offset="1" stop-color="#0C8073"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#asc-tile)"/>

  <g fill="#FFFFFF">
    <rect x="104" y="304" width="52" height="92"  rx="16"/>
    <rect x="180" y="252" width="52" height="144" rx="16"/>
    <rect x="256" y="196" width="52" height="200" rx="16"/>
    <rect x="332" y="140" width="52" height="256" rx="16"/>
  </g>

  <path d="M104 416 H408" fill="none" stroke="#FFFFFF" stroke-opacity="0.40"
        stroke-width="12" stroke-linecap="round"/>

  <path d="M330 112 L358 84 L386 112" fill="none" stroke="#FFFFFF"
        stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
